<!doctype html>
<html class="no-js" lang="en">
  <head>
    <!-- meta data -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/style.css">
    
  </head>

  <body>
    <!-- Start of header-->
    <header class="top-area">
        <nav>
            <div class="navbar-header">
                <a href="">Circularity</a>
            </div>
            <div class="navbar-menu">
                <ul>
                    <li><a href="#information">Information</a></li>
                    <li><a href="#calculator">Calculator</a></l>
                    <li><a href="#about">About us</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="carousel">
        <div class="wrapper">
            <div class="container">
                <input type="radio" name="slide" id="c1" checked>
                <label for="c1" class="card">
                    <div class="row">
                        <div class="icon">1</div>
                        <div class="description">
                            <h4>Pillar 1</h4>
                            <p>Pillar 1</p>
                        </div>
                    </div>
                </label>
                <input type="radio" name="slide" id="c2" >
                <label for="c2" class="card">
                    <div class="row">
                        <div class="icon">2</div>
                        <div class="description">
                            <h4>Pillar 2</h4>
                            <p>Pillar 2</p>
                        </div>
                    </div>
                </label>
                <input type="radio" name="slide" id="c3" >
                <label for="c3" class="card">
                    <div class="row">
                        <div class="icon">3</div>
                        <div class="description">
                            <h4>Pillar 3</h4>
                            <p>Pillar 3</p>
                        </div>
                    </div>
                </label>
                <input type="radio" name="slide" id="c4" >
                <label for="c4" class="card">
                    <div class="row">
                        <div class="icon">4</div>
                        <div class="description">
                            <h4>Pillar 4</h4>
                            <p>Pillar 4</p>
                        </div>
                    </div>
                </label>
            </div>
        </div>
    </div>


    <!-- Start of main-->
    <main>
        <hr><div class="line_caption">Information</div> <hr />
        <section id="information" class="information">Information</section>
        <hr><div class="line_caption_dark">Calculator section</div> <hr />
        <section id="calculator" class="calculator">Calculator section</section>
        <hr><div class="line_caption">About section</div> <hr />
        <section id="about" class="about">About section</section>
    </main>


    <!-- Start of footer-->
    <footer></footer>
  </body>
</html>
