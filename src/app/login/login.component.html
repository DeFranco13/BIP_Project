<!doctype html>
<html lang="en"> 
 <head> 
  <meta charset="UTF-8"> 
 </head> 
 <body>
    <div *ngIf="this.login == true" class="signin"> 
        <div class="content"> 
            <h2>Sign In</h2> 
            <div class="form"> 
                <div class="inputBox">
                    <input type="text" placeholder="Username" [(ngModel)]="username" required>
                </div>
                <div class="inputBox">
                    <input type="password" placeholder="Password" [(ngModel)]="password" required>
                </div>
            <div *ngIf="this.retryLogin == true" class="wrongCreds">
                <h3>Invalid password or username!</h3>
            </div>
            </div>
            <div class="loginBox"> 
                <button (click)="submitLogin(this.username, this.password)">Login</button>
            </div> 
        </div>
    </div>
    <div *ngIf="this.credsTrue == true" class="success">
        <div class="contentSuccess">
            <h2>Login succesfull</h2>
            <div class="continueBox">
                <a [routerLink]="['..']">Continue</a>
            </div>
        </div>
    </div>


 </body>
</html>
