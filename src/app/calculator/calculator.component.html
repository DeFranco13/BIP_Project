<header>
    <header class="top-area">
        <nav>
            <div class="navbar-header">
                <a [routerLink]="['/welcome']"></a>
            </div>
            <div class="navbar-menu">
                <ul>
                    <li><a [routerLink]="['/welcome']">Return to main page</a></li>
                </ul>
            </div>
        </nav>
      </header>
</header>
<main>

    <!--Information section-->
    <hr>
        <div id="information" class="line_caption_dark">Calculator</div> 
    <hr/>   

    <!--Information about what the calculator does and the rules!-->
    <body>
        <div *ngIf="boolCalculator == false" class="start-screen-calculator">
            <h1>Guide</h1>
            <p>This calculator .... </p>
            <p>By using this ....</p>
            <p>Please, press the button to start!</p>

            <div class = "button-container">
                <button id ="button1" (click)="StartCalculator()">Start</button>
            </div>
        </div>



        <!--Questions-->
        <div *ngIf="boolCalculator == true && JsonArray" class="questions">
            <div *ngFor="let key of getObjectKeys(JsonArray); let j = index">
                <!--This checks the current key like health etc this is important for the question pages-->
                <div *ngIf="key == getCurrentPillar()" class="key1">
                    <h1>{{ key }}</h1>
                    <div *ngFor="let question of JsonArray[key]?.questions; let i = index">

                        <div class="questions-layout">{{question.question}}</div>

                        <div *ngIf="question.answer_style == 'Scale' " class="SliderDiv">
                            <h1><span id="output">{{inputElement.value}}</span></h1>
                            <input (click)="pushAnswer(j, i, 'fixitlater')" min="{{question.possible_answers.min}}" max="{{question.possible_answers.max}}"  #inputElement (change)="pushAnswer(j, i, inputElement.value)" type="range" class="slider" id="slider_{{i}}" value="{{question.possible_answers.min}}" >
                        </div>

                        <div *ngIf="question.answer_style == 'Multiple Choice' ">
                            <label class="multicontainer">"{{question.possible_answers.body}}"
                                <input type="checkbox" checked="checked">
                                <span class="checkmark"></span>
                            </label>
                              
                            <label class="multicontainer">Two
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                              
                            <label class="multicontainer">Three
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                              
                            <label class="multicontainer">Four
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>

                            <label class="multicontainer">Five
                                <input type="checkbox">
                                <span class="checkmark"></span>
                            </label>
                            
                        
                        </div>
                        
                        <!--This checks type of answer and creates custom answer-->
                        <div *ngIf="question.answer_style == 'Agree/Disagree' " class="radio">
                            <input (click)="pushAnswer(j, i, 'strong disagree')" type="radio" value="Strongly Disagree" class="Radio_input" id="Radio1_{{i}}" name="radio_1_{{i}}">
                            <label class="Radio_label" id="agree1_{{i}}" for="Radio1_{{i}}">Strongly Disagree</label>
                    
                            <input (click)="pushAnswer(j, i, 'disagree')" type="radio" value="Disagree" class="Radio_input" id="Radio2_{{i}}" name="radio_1_{{i}}">
                            <label class="Radio_label" id="agree2_{{i}}" for="Radio2_{{i}}">Disagree</label>
                            
                            <input (click)="pushAnswer(j, i, 'neutral')" type="radio" value="Neutral" class="Radio_input" id="Radio3_{{i}}" name="radio_1_{{i}}">
                            <label class="Radio_label" id="agree3_{{i}}" for="Radio3_{{i}}">Neutral</label>
                                
                            <input (click)="pushAnswer(j, i, 'agree')" type="radio" value="Agree" class="Radio_input" id="Radio4_{{i}}" name="radio_1_{{i}}">
                            <label class="Radio_label" id="agree4_{{i}}" for="Radio4_{{i}}">Agree</label>

                            <input (click)="pushAnswer(j, i, 'strongly agree')" type="radio" value="Strongly Agree" class="Radio_input" id="Radio5_{{i}}" name="radio_1_{{i}}">
                            <label class="Radio_label" id="agree5_{{i}}" for="Radio5_{{i}}">Strongly Agree</label>
                        </div>

                        <div *ngIf="question.answer_style == 'Yes/No' " class="yesno">
                            <input (click)="pushAnswer(j, i, 'yes')" type="radio" value="Yes" class="Yesno_input" id="Yesno1_{{i}}" name="yesno_1_{{i}}">
                            <label class="Yesno_label_L" id="yes1_{{i}}" for="Yesno1_{{i}}">Yes</label>

                            <input (click)="pushAnswer(j, i, 'no')" type="radio" value="No" class="Yesno_input" id="Yesno2_{{i}}" name="yesno_1_{{i}}">
                            <label class="Yesno_label_R" id="yes2_{{i}}" for="Yesno2_{{i}}">No</label>             
                        </div>
                        
                        <input *ngIf="question.answer_style == 'Custom' "type="text" class="Custom" placeholder="Enter your answer here" #inputElement (change)="pushAnswer(j, i, inputElement.value)">

                    </div>

                    <div class = 'button-container1'>
                        <button *ngIf="getCurrentKey() > 0" (click)="removeCurrentKey()" >Previous</button>
                        <div *ngIf="getCurrentKey() > 0" class="blank"></div>
                        <button *ngIf="getCurrentKey() < 7" (click)="addCurrentKey()">Next</button>
                        <button (click)="SubmitResults()" *ngIf="getCurrentKey() >= 7">Finish</button>
                    </div>
                </div>
            </div>  
        </div>
    </body>
    
    <!-- Start of footer-->
    <footer>
        <hr>
            <section class="footer">Designed, Developed by Maksym Taran, Jordi Fransen.</section> 
        <hr/>
    </footer>

</main>
