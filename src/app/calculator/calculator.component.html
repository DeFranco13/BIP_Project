<header>
    <header class="top-area">
        <nav>
            <div class="navbar-header">
                <a [routerLink]="['/welcome']"></a>
            </div>
            <div class="navbar-menu">
                <ul>
                    <li><a [routerLink]="['/welcome']">Return to main page</a></li>
                </ul>
            </div>
        </nav>
      </header>
</header>
<main>

    <!--Information section-->
    <hr>
        <div id="information" class="line_caption_dark">Calculator</div> 
    <hr/>   

    <!--Information about what the calculator does and the rules!-->
    <body>
        <div *ngIf="boolCalculator == false" class="start-screen-calculator">
            <h1>Guide</h1>
            <p>This calculator .... </p>
            <p>By using this ....</p>
            <p>Please, press the button to start!</p>

            <div class = "button-container">
                <button id ="button1" (click)="StartCalculator()">Start</button>
            </div>
        </div>



        <!--Questions-->
        <div *ngIf="boolCalculator == true && JsonArray" class="questions">
            <div *ngFor="let key of getObjectKeys(JsonArray); let j = index">
                <!--This checks the current key like health etc this is important for the question pages-->
                <div *ngIf="key == getCurrentPillar()" class="key1">
                    <h1>{{ key }}</h1>
                    <div *ngFor="let question of JsonArray[key]?.questions; let i = index">

                        <div class="questions-layout">{{question.question}}</div>

                        <div *ngIf="question.answer_style == 'Scale' " class="SliderDiv">

                            <h1><span id="output">{{inputElement.value}}</span></h1>
                            <input  min="{{question.possible_answers.min}}" max="{{question.possible_answers.max}}"  #inputElement (change)="pushAnswer(j, i, inputElement.value, question.value)" type="range" class="slider" id="slider_{{i}}" value="{{question.possible_answers.min}}" >
                        </div>

                        <div *ngIf="question.answer_style == 'Multiple Choice' ">
                            <div *ngFor="let answer of question.possible_answers; let k = index">
                                <label class="multicontainer">"{{answer.body}}"
                                    <input type="checkbox" (click)="pushAnswerMultipleChoice(j, i, answer.body)" name="slider_{{i}}">
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>

                        <div *ngIf="question.answer_style == 'One Choice'">
                            <div *ngFor="let answer of question.possible_answers">
                                <label class="multicontainer">"{{answer.body}}"
                                    <input type="radio" (click)="pushAnswer(j, i, answer.body, answer.value)" name="slider_{{i}}">
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>
                        
                        <!--This checks type of answer and creates custom answer-->
                        <div *ngIf="question.answer_style == 'Agree/Disagree' " class="radio">
                            <div *ngFor="let answer of question.possible_answers">
                                <input (click)="pushAnswer(j, i, answer.body, answer.value)" type="radio" value="Strongly Disagree" class="Radio_input" id="Radio1_{{i}}" name="radio_1_{{i}}">
                                <label class="Radio_label1" id="agree1_{{i}}" for="Radio1_{{i}}">{{answer.body}}</label>
                            </div>
                        </div>

                        <div *ngIf="question.answer_style == 'Yes/No' " class="yesno">
                            <input *ngIf="question.correct_answer == 'Yes'" (click)="pushAnswer(j, i, 'Yes', question.value)" type="radio" value="Yes" class="Yesno_input" id="Yesno1_{{i}}" name="yesno_1_{{i}}">
                            <input *ngIf="question.correct_answer != 'Yes'" (click)="pushAnswer(j, i, 'Yes', 0)" type="radio" value="Yes" class="Yesno_input" id="Yesno1_{{i}}" name="yesno_1_{{i}}">
                            <label class="Yesno_label_L" id="yes1_{{i}}" for="Yesno1_{{i}}">Yes</label>

                            <input *ngIf="question.correct_answer == 'No'" (click)="pushAnswer(j, i, 'No', question.value)" type="radio" value="No" class="Yesno_input" id="Yesno2_{{i}}" name="yesno_1_{{i}}">
                            <input *ngIf="question.correct_answer != 'No'"  (click)="pushAnswer(j, i, 'Yes', 0)" type="radio" value="No" class="Yesno_input" id="Yesno2_{{i}}" name="yesno_1_{{i}}">
                            <label class="Yesno_label_R" id="yes2_{{i}}" for="Yesno2_{{i}}">No</label>             
                        </div>
                        
                        <input *ngIf="question.answer_style == 'Custom' "type="text" class="Custom" placeholder="Enter your answer here" #inputElement (change)="pushAnswer(j, i, inputElement.value, 0)">

                    </div>

                    <div class = 'button-container1'>
                        <button *ngIf="getCurrentKey() > 0" (click)="removeCurrentKey()" >Previous</button>
                        <div *ngIf="getCurrentKey() > 0" class="blank"></div>
                        <button *ngIf="getCurrentKey() < 7" (click)="addCurrentKey()">Next</button>
                        <button (click)="SubmitResults()" *ngIf="getCurrentKey() >= 7">Finish</button>
                    </div>
                </div>
            </div>  
        </div>
    </body>
    
    <!-- Start of footer-->
    <footer>
        <hr>
            <section class="footer">Designed, Developed by Maksym Taran, Jordi Fransen.</section> 
        <hr/>
    </footer>

</main>
